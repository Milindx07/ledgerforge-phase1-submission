[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgerforge"
version = "0.1.0"
description = "Layered FastAPI employee, hierarchy, and seed-data service for LedgerForge Phase 1."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.2",
    "email-validator>=2.2.0",
    "faker>=26.0.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "openpyxl>=3.1.5",
    "pandas>=2.2.2",
    "psycopg[binary]>=3.2.1",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    "sqlalchemy>=2.0.32",
    "uvicorn[standard]>=0.30.6"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.3"
]

[tool.setuptools]
packages = ["app", "app.api", "app.api.routes", "app.core", "app.models", "app.schemas", "app.services", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
